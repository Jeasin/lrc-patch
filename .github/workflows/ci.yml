name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Official Python images keep every version available regardless of which
    # Ubuntu the runner happens to be on.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mutagen>=1.47" "curl_cffi>=0.7"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check the entry script still runs
        run: python lrcpatch -h > /dev/null

  package:
    name: build & install the wheel
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel and run it
        run: |
          python -m pip install dist/*.whl
          lrcpatch -h > /dev/null
          lrcpatch config

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
