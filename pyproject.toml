[project]
name = "lrc-patch"
version = "2.6"
description = "Batch lyrics planning and embedding for a local music library"
requires-python = ">=3.9"
dependencies = ["mutagen>=1.47", "curl_cffi>=0.7"]

[project.scripts]
lrcpatch = "lrc_patch.cli:run"
lyrics = "lrc_patch.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lrc_patch"]
